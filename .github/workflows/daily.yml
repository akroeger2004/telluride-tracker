name: daily

on:
  schedule:
    - cron: "30 14 * * *"   # every day at 14:30 UTC (7:30 a.m. in Telluride)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch sources, build history, write status, open the daily issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m telltracker.pipeline --issue
      - name: Commit raw files, history and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
